<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Nursing Coaching - Student Information Form</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-pink: #c2185b;
            --dark-pink: #880e4f;
            --light-pink: #f8bbd0;
            --bg-color: #fce4ec;
            --white: #ffffff;
            --text-color: #333333;
            --gray: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(136, 14, 79, 0.15);
            position: relative;
        }

        /* Header & Logo */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--light-pink);
            padding-bottom: 15px;
        }

        .logo-container img {
            max-height: 50px;
            object-fit: contain;
        }

        .admin-btn {
            background-color: var(--dark-pink);
            color: var(--white);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .admin-btn:hover {
            background-color: var(--primary-pink);
        }

        h2 {
            text-align: center;
            color: var(--dark-pink);
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--dark-pink);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1c4e9;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(194, 24, 91, 0.15);
        }

        input[readonly] {
            background-color: #f5f5f5;
            color: var(--gray);
            cursor: not-allowed;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }

        /* Success Message Box */
        .success-box {
            text-align: center;
            padding: 30px 20px;
        }

        .success-box i {
            font-size: 50px;
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .success-box h3 {
            color: var(--dark-pink);
            font-size: 22px;
            margin-bottom: 10px;
        }

        .success-box p {
            color: var(--gray);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <img src="https://i.ibb.co.com/MyhpZCjG/SIMPLE-PULSE-LOGO-DESIGN-RED.png" alt="Pulse Nursing Logo">
            </div>
            <!-- Admin button links to admin.html page -->
            <a href="admin.html" class="admin-btn">
                <i class="fa-solid fa-lock"></i> Admin Login
            </a>
        </div>

        <h2>Student Delivery Information</h2>

        <!-- Main Form Wrapper -->
        <div id="formWrapper">
            <form id="studentForm" onsubmit="handleFormSubmit(event)">
                
                <div class="form-group">
                    <label>Order Date</label>
                    <input type="text" id="orderDate" readonly>
                </div>

                <div class="form-group">
                    <label>Delivery System</label>
                    <select id="deliverySystem" onchange="toggleAddressField()" required>
                        <option value="" disabled selected>Select Delivery Method</option>
                        <option value="Office Delivery">Office Delivery</option>
                        <option value="Home Delivery">Home Delivery</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Student Name (English Only)</label>
                    <input type="text" id="studentName" placeholder="Enter full name in English" oninput="validateEnglishName(this)" required>
                </div>

                <div class="form-group">
                    <label>Phone Number (11 Digit English Number)</label>
                    <input type="text" id="phoneNumber" placeholder="e.g. 01712345678" maxlength="11" oninput="validatePhone(this)" required>
                </div>

                <div class="form-group">
                    <label>Course</label>
                    <select id="course" required>
                        <option value="" disabled selected>Select Course</option>
                        <option value="BSC">BSC</option>
                        <option value="DIPLOMA">DIPLOMA</option>
                        <option value="Midwifery">Midwifery</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Level</label>
                    <select id="level" required>
                        <option value="" disabled selected>Select Level</option>
                        <option value="Admission">Admission</option>
                        <option value="License">License</option>
                        <option value="Job">Job</option>
                        <option value="Academic">Academic</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>District</label>
                    <input type="text" id="district" placeholder="Enter District" required>
                </div>

                <div class="form-group">
                    <label>Upazilla / Thana</label>
                    <input type="text" id="upazilla" placeholder="Enter Upazilla or Thana" required>
                </div>

                <div class="form-group hidden" id="addressGroup">
                    <label>Address Line</label>
                    <input type="text" id="addressLine" placeholder="Village, Road, House No, etc.">
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Submit Information</button>
            </form>
        </div>

        <!-- Success Message Container -->
        <div id="successMessageContainer" class="hidden success-box">
            <i class="fa-solid fa-circle-check"></i>
            <h3>ধন্যবাদ!</h3>
            <p>আপনার তথ্য সফলভাবে সাবমিট করা হয়েছে।</p>
        </div>
    </div>

   <!-- JavaScript Logic -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyx9vPi6Ob_-FR4j3TQlDDWpwBkgi4ILek5VBz9HcHk-rOBqF29-viIyIID4jXZxgCF/exec';

        // Auto set current date (শুধুমাত্র তারিখ দেখাবে, সময় আসবে না)
        window.onload = function() {
            const today = new Date();
            const formattedDate = today.toISOString().split('T')[0];
            document.getElementById('orderDate').value = formattedDate;
        };

        // Toggle Address Line visibility based on Delivery System
        function toggleAddressField() {
            const deliverySystem = document.getElementById('deliverySystem').value;
            const addressGroup = document.getElementById('addressGroup');
            const addressInput = document.getElementById('addressLine');

            if (deliverySystem === 'Home Delivery') {
                addressGroup.classList.remove('hidden');
                addressInput.setAttribute('required', 'true');
            } else {
                addressGroup.classList.add('hidden');
                addressInput.removeAttribute('required');
                addressInput.value = ''; 
            }
        }

        // Validate English Name only
        function validateEnglishName(input) {
            input.value = input.value.replace(/[^A-Za-z\s]/g, '');
        }

        // Validate 11 Digit English Phone Number
        function validatePhone(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
            if(input.value.length > 11) {
                input.value = input.value.slice(0, 11);
            }
        }

        // Form Submit Handler
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const deliverySys = document.getElementById('deliverySystem').value;
            
            // ফোন নাম্বারের শুরুতে অ্যাপোস্ট্রোফি (') যুক্ত করা হলো যাতে গুগল শিটে জিরো (0) মুছে না যায়
            const rawPhone = document.getElementById('phoneNumber').value;
            const formattedPhone = rawPhone.startsWith('0') ? `'${rawPhone}` : rawPhone;

            const formData = new FormData();
            formData.append('orderDate', document.getElementById('orderDate').value);
            formData.append('deliverySystem', deliverySys);
            formData.append('studentName', document.getElementById('studentName').value);
            formData.append('phoneNumber', formattedPhone); // টেক্সট ফরম্যাটেড ফোন নাম্বার
            formData.append('course', document.getElementById('course').value);
            formData.append('level', document.getElementById('level').value);
            formData.append('district', document.getElementById('district').value);
            formData.append('upazilla', document.getElementById('upazilla').value);
            formData.append('addressLine', deliverySys === 'Home Delivery' ? document.getElementById('addressLine').value : 'N/A');

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    document.getElementById('formWrapper').classList.add('hidden');
                    document.getElementById('successMessageContainer').classList.remove('hidden');
                })
                .catch(error => {
                    alert('Error! Something went wrong.');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Submit Information";
                    console.error('Error!', error.message);
                });
        }
    </script>
</body>
</html>
