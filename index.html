<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Nursing Coaching - Student Form</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-pink: #c2185b;
            --dark-pink: #880e4f;
            --light-pink: #f8bbd0;
            --bg-color: #fce4ec;
            --white: #ffffff;
            --text-color: #333333;
            --gray: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(136, 14, 79, 0.15);
            position: relative;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--light-pink);
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--primary-pink);
            object-fit: cover;
        }

        .logo-area h2 {
            color: var(--dark-pink);
            font-size: 20px;
        }

        .logo-area p {
            font-size: 12px;
            color: var(--gray);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-records {
            background-color: var(--primary-pink);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-records:hover {
            background-color: var(--dark-pink);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark-pink);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 5px rgba(194, 24, 91, 0.2);
        }

        .radio-group-box {
            border: 1px solid #ddd;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: #fff;
            min-height: 45px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 400;
            color: var(--text-color);
            cursor: pointer;
        }

        .submit-btn {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: var(--dark-pink);
        }

        .success-box {
            text-align: center;
            padding: 40px;
        }

        .success-box i {
            font-size: 50px;
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .success-box h3 {
            color: var(--dark-pink);
            margin-bottom: 10px;
        }

        .hidden {
            display: none !important;
        }

        @media(max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header -->
        <div class="top-header">
            <div class="logo-area">
                <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/50'">
                <div>
                    <h2>Pulse Nursing Coaching</h2>
                    <p>নোর্স গড়ার প্রত্যয়ে</p>
                </div>
            </div>
            <div class="header-buttons">
                <a href="admin.html" class="btn-records"><i class="fa-solid fa-table"></i> Records</a>
            </div>
        </div>

        <!-- Form Wrapper -->
        <div id="formWrapper">
            <form id="studentForm" onsubmit="handleFormSubmit(event)">
                <div class="form-grid">
                    <!-- Order Date -->
                    <div class="form-group">
                        <label for="orderDate">Order Date:</label>
                        <input type="date" id="orderDate" required>
                    </div>

                    <!-- Delivery System -->
                    <div class="form-group">
                        <label>Delivery System:</label>
                        <div class="radio-group-box">
                            <label class="radio-label"><input type="radio" name="deliverySystem" value="Office Delivery" checked onclick="toggleAddressField()"> Office Delivery</label>
                            <label class="radio-label"><input type="radio" name="deliverySystem" value="Home Delivery" onclick="toggleAddressField()"> Home Delivery</label>
                        </div>
                    </div>

                    <!-- Student Name -->
                    <div class="form-group">
                        <label for="studentName">Student Name (English only):</label>
                        <input type="text" id="studentName" placeholder="Enter student name" oninput="validateEnglishName(this)" required>
                    </div>

                    <!-- Phone Number -->
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number (11 digits):</label>
                        <input type="text" id="phoneNumber" placeholder="017xxxxxxxx" maxlength="11" oninput="validatePhone(this)" required>
                    </div>

                    <!-- Course (Radio) -->
                    <div class="form-group">
                        <label>Course:</label>
                        <div class="radio-group-box">
                            <label class="radio-label"><input type="radio" name="course" value="BSC" required> BSC</label>
                            <label class="radio-label"><input type="radio" name="course" value="DIPLOMA"> DIPLOMA</label>
                            <label class="radio-label"><input type="radio" name="course" value="Midwifery"> Midwifery</label>
                        </div>
                    </div>

                    <!-- Level (Radio) -->
                    <div class="form-group">
                        <label>Level:</label>
                        <div class="radio-group-box">
                            <label class="radio-label"><input type="radio" name="level" value="Admission" required> Admission</label>
                            <label class="radio-label"><input type="radio" name="level" value="License"> License</label>
                            <label class="radio-label"><input type="radio" name="level" value="Job"> Job</label>
                            <label class="radio-label"><input type="radio" name="level" value="Academic"> Academic</label>
                        </div>
                    </div>

                    <!-- District -->
                    <div class="form-group">
                        <label for="district">District (English only):</label>
                        <input type="text" id="district" placeholder="Type district" oninput="validateEnglishName(this)" required>
                    </div>

                    <!-- Upazilla -->
                    <div class="form-group">
                        <label for="upazilla">Upazilla / Thana (English only):</label>
                        <input type="text" id="upazilla" placeholder="Type upazilla/thana" oninput="validateEnglishName(this)" required>
                    </div>

                    <!-- Address Line (Hidden by default) -->
                    <div class="form-group full-width hidden" id="addressGroup">
                        <label for="addressLine">Address Line:</label>
                        <input type="text" id="addressLine" placeholder="House/Village, Post Office, etc.">
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Add Label Entry</button>
            </form>
        </div>

        <!-- Success Message Container -->
        <div id="successMessageContainer" class="success-box hidden">
            <i class="fa-solid fa-circle-check"></i>
            <h3>Information Submitted Successfully!</h3>
            <p>You can now use this data for slip generation.</p>
            <button class="btn-records" style="margin: 20px auto 0 auto;" onclick="location.reload()">Submit Another Entry</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyx9vPi6Ob_-FR4j3TQlDDWpwBkgi4ILek5VBz9HcHk-rOBqF29-viIyIID4jXZxgCF/exec';

        // Auto set current date (শুধুমাত্র তারিখ দেখাবে, সময় আসবে না)
        window.onload = function() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('orderDate').value = `${year}-${month}-${day}`;
        };

        // Toggle Address Line visibility based on Delivery System Radio
        function toggleAddressField() {
            const deliverySystem = document.querySelector('input[name="deliverySystem"]:checked').value;
            const addressGroup = document.getElementById('addressGroup');
            const addressInput = document.getElementById('addressLine');

            if (deliverySystem === 'Home Delivery') {
                addressGroup.classList.remove('hidden');
                addressInput.setAttribute('required', 'true');
            } else {
                addressGroup.classList.add('hidden');
                addressInput.removeAttribute('required');
                addressInput.value = ''; 
            }
        }

        // Validate English Name only
        function validateEnglishName(input) {
            input.value = input.value.replace(/[^A-Za-z\s]/g, '');
        }

        // Validate 11 Digit English Phone Number
        function validatePhone(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
            if(input.value.length > 11) {
                input.value = input.value.slice(0, 11);
            }
        }

        // Form Submit Handler
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const deliverySys = document.querySelector('input[name="deliverySystem"]:checked').value;
            const courseVal = document.querySelector('input[name="course"]:checked') ? document.querySelector('input[name="course"]:checked').value : '';
            const levelVal = document.querySelector('input[name="level"]:checked') ? document.querySelector('input[name="level"]:checked').value : '';
            
            // ফোন নাম্বারের শুরুতে অ্যাপোস্ট্রোফি (') যুক্ত করা হলো যাতে শিটে জিরো (0) মুছে না যায়
            const rawPhone = document.getElementById('phoneNumber').value;
            const formattedPhone = rawPhone.startsWith('0') ? `'${rawPhone}` : rawPhone;

            const formData = new FormData();
            formData.append('orderDate', document.getElementById('orderDate').value);
            formData.append('deliverySystem', deliverySys);
            formData.append('studentName', document.getElementById('studentName').value);
            formData.append('phoneNumber', formattedPhone);
            formData.append('course', courseVal);
            formData.append('level', levelVal);
            formData.append('district', document.getElementById('district').value);
            formData.append('upazilla', document.getElementById('upazilla').value);
            formData.append('addressLine', deliverySys === 'Home Delivery' ? document.getElementById('addressLine').value : 'N/A');

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    document.getElementById('formWrapper').classList.add('hidden');
                    document.getElementById('successMessageContainer').classList.remove('hidden');
                })
                .catch(error => {
                    alert('Error! Something went wrong.');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Add Label Entry";
                    console.error('Error!', error.message);
                });
        }
    </script>
</body>
</html>
