<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pulse Nursing</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Workbook Export (.xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary-pink: #c2185b;
            --dark-pink: #880e4f;
            --light-pink: #f8bbd0;
            --bg-color: #fce4ec;
            --white: #ffffff;
            --text-color: #333333;
            --gray: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-container {
            width: 100%;
            max-width: 1250px;
            background: var(--white);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(136, 14, 79, 0.15);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--light-pink);
            padding-bottom: 15px;
        }

        .admin-header h2 {
            color: var(--dark-pink);
            font-size: 20px;
        }

        .back-btn {
            background-color: var(--gray);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background-color: #555;
        }

        /* Filter Controls Bar */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: #fff5f8;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--light-pink);
            align-items: center;
        }

        .filter-bar select, .filter-bar input {
            padding: 8px 12px;
            border: 1px solid #d1c4e9;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: white;
        }

        .filter-bar input {
            flex: 1;
            min-width: 180px;
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 55vh;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table th, table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }

        table th {
            background-color: var(--dark-pink);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-done {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .status-pending {
            background-color: #ffebee;
            color: #c62828;
        }

        .admin-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-custom {
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
        }

        .btn-excel { background-color: #2e7d32; }
        .btn-excel:hover { background-color: #1b5e20; }

        .btn-csv { background-color: #0277bd; }
        .btn-csv:hover { background-color: #01579b; }

        .btn-delete { background-color: #c62828; }
        .btn-delete:hover { background-color: #b71c1c; }

        .btn-mark-done { background-color: #00897b; }
        .btn-mark-done:hover { background-color: #00695c; }

        .btn-mark-pending { background-color: #ef6c00; }
        .btn-mark-pending:hover { background-color: #e65100; }

        .loading-text {
            text-align: center;
            padding: 30px;
            color: var(--gray);
            font-size: 15px;
        }

        /* Modern Custom Password Modal UI */
        #authModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }

        .modal-card i {
            font-size: 40px;
            color: var(--primary-pink);
            margin-bottom: 15px;
        }

        .modal-card h3 {
            color: var(--dark-pink);
            margin-bottom: 8px;
            font-size: 20px;
        }

        .modal-card p {
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 20px;
        }

        .modal-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1c4e9;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        .modal-card input:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(194, 24, 91, 0.15);
        }

        .modal-card button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-card button:hover {
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Modern Password Prompt Modal -->
    <div id="authModal">
        <div class="modal-card">
            <i class="fa-solid fa-lock"></i>
            <h3>Admin Authentication</h3>
            <p>Please enter your secure password to access the dashboard.</p>
            <input type="password" id="adminPasswordInput" placeholder="Enter password..." autofocus onkeydown="if(event.key === 'Enter') verifyPassword()">
            <button onclick="verifyPassword()">Login to Dashboard</button>
        </div>
    </div>

    <!-- Admin Dashboard Main Container -->
    <div class="admin-container">
        <div class="admin-header">
            <h2><i class="fa-solid fa-gauge"></i> Admin Dashboard</h2>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Form</a>
        </div>
        
        <!-- Filter & Search Bar -->
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search by name, phone, district..." onkeyup="filterTable()">
            <select id="filterCourse" onchange="filterTable()">
                <option value="">All Courses</option>
                <option value="BSC">BSC</option>
                <option value="DIPLOMA">DIPLOMA</option>
                <option value="Midwifery">Midwifery</option>
            </select>
            <select id="filterLevel" onchange="filterTable()">
                <option value="">All Levels</option>
                <option value="Admission">Admission</option>
                <option value="License">License</option>
                <option value="Job">Job</option>
                <option value="Academic">Academic</option>
            </select>
            <select id="filterStatus" onchange="filterTable()">
                <option value="">All Status</option>
                <option value="Delivered">Delivered</option>
                <option value="Pending">Pending</option>
            </select>
        </div>

        <div class="table-responsive">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                        <th>SL</th>
                        <th>Order Date</th>
                        <th>Delivery System</th>
                        <th>Student Name</th>
                        <th>Phone Number</th>
                        <th>Course</th>
                        <th>Level</th>
                        <th>District</th>
                        <th>Upazilla</th>
                        <th>Address Line</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="12" class="loading-text">Please login first...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="admin-actions">
            <div class="action-group">
                <button class="btn-custom btn-mark-done" onclick="markSelectedStatus('Delivered')"><i class="fa-solid fa-check"></i> Mark Delivered</button>
                <button class="btn-custom btn-mark-pending" onclick="markSelectedStatus('Pending')"><i class="fa-solid fa-clock"></i> Mark Pending</button>
                <button class="btn-custom btn-delete" onclick="deleteSelectedRows()"><i class="fa-solid fa-trash"></i> Delete Selected</button>
            </div>
            <div class="action-group">
                <button class="btn-custom btn-csv" onclick="exportToCSV()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                <button class="btn-custom btn-excel" onclick="exportToWorkbook()"><i class="fa-solid fa-file-excel"></i> Export Workbook (.xlsx)</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyx9vPi6Ob_-FR4j3TQlDDWpwBkgi4ILek5VBz9HcHk-rOBqF29-viIyIID4jXZxgCF/exec';
        let allMasterData = []; // মূল ডাটা স্টোর করার জন্য

        // Password Verification
        function verifyPassword() {
            let password = document.getElementById('adminPasswordInput').value;
            if (password === "SM@890174s") {
                document.getElementById('authModal').style.display = 'none';
                loadTableData();
            } else {
                alert("Incorrect Password!");
                document.getElementById('adminPasswordInput').value = '';
            }
        }

        // Load data into admin table from Google Sheets API
        function loadTableData() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = `<tr><td colspan="12" class="loading-text">Loading data from Google Sheets...</td></tr>`;
            
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    // ব্রাউজারের LocalStorage থেকে মার্ক করা স্ট্যাটাস লোড করা (যেহেতু গুগল শিটে সরাসরি রাইট ব্যাক করার কোড নেই)
                    let savedStatuses = JSON.parse(localStorage.getItem('pulse_delivery_status') || '{}');
                    
                    allMasterData = data.map((item, index) => {
                        return {
                            ...item,
                            uniqueId: index,
                            deliveryStatus: savedStatuses[index] || 'Pending'
                        };
                    });

                    renderTable(allMasterData);
                })
                .catch(error => {
                    tableBody.innerHTML = `<tr><td colspan="12" style="text-align:center; color:red; padding: 20px;">Failed to load data.</td></tr>`;
                    console.error('Error loading data:', error);
                });
        }

        // Render Table Data with Serial Numbers
        function renderTable(dataToRender) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            if(dataToRender.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="12" style="text-align:center; color:#777; padding: 20px;">No data found.</td></tr>`;
                return;
            }

            dataToRender.forEach((item, index) => {
                let statusBadge = item.deliveryStatus === 'Delivered' 
                    ? `<span class="status-badge status-done">Delivered</span>` 
                    : `<span class="status-badge status-pending">Pending</span>`;

                let row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="checkbox" class="row-checkbox" data-id="${item.uniqueId}"></td>
                    <td>${index + 1}</td>
                    <td>${item.orderDate || ''}</td>
                    <td>${item.deliverySystem || ''}</td>
                    <td>${item.studentName || ''}</td>
                    <td>${item.phoneNumber || ''}</td>
                    <td>${item.course || ''}</td>
                    <td>${item.level || ''}</td>
                    <td>${item.district || ''}</td>
                    <td>${item.upazilla || ''}</td>
                    <td>${item.addressLine || ''}</td>
                    <td>${statusBadge}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Filter / Search Logic
        function filterTable() {
            let searchVal = document.getElementById('searchInput').value.toLowerCase();
            let courseVal = document.getElementById('filterCourse').value;
            let levelVal = document.getElementById('filterLevel').value;
            let statusVal = document.getElementById('filterStatus').value;

            let filtered = allMasterData.filter(item => {
                let matchesSearch = (item.studentName && item.studentName.toLowerCase().includes(searchVal)) ||
                                    (item.phoneNumber && item.phoneNumber.includes(searchVal)) ||
                                    (item.district && item.district.toLowerCase().includes(searchVal));
                
                let matchesCourse = courseVal === "" || item.course === courseVal;
                let matchesLevel = levelVal === "" || item.level === levelVal;
                let matchesStatus = statusVal === "" || item.deliveryStatus === statusVal;

                return matchesSearch && matchesCourse && matchesLevel && matchesStatus;
            });

            renderTable(filtered);
        }

        // Toggle Select All Checkboxes
        function toggleSelectAll(masterCheckbox) {
            let checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
        }

        // Mark Selected as Delivered / Pending
        function markSelectedStatus(status) {
            let selectedCheckboxes = document.querySelectorAll('.row-checkbox:checked');
            if (selectedCheckboxes.length === 0) {
                alert("Please select at least one student!");
                return;
            }

            let savedStatuses = JSON.parse(localStorage.getItem('pulse_delivery_status') || '{}');
            selectedCheckboxes.forEach(cb => {
                let id = cb.getAttribute('data-id');
                savedStatuses[id] = status;
                let found = allMasterData.find(item => item.uniqueId == id);
                if (found) found.deliveryStatus = status;
            });

            localStorage.setItem('pulse_delivery_status', JSON.stringify(savedStatuses));
            filterTable();
            alert(`Successfully marked as ${status}!`);
        }

        // Delete Selected Rows (Local UI view deletion)
        function deleteSelectedRows() {
            let selectedCheckboxes = document.querySelectorAll('.row-checkbox:checked');
            if (selectedCheckboxes.length === 0) {
                alert("Please select at least one row to delete!");
                return;
            }

            if (confirm("Are you sure you want to delete selected rows from the view?")) {
                let idsToDelete = Array.from(selectedCheckboxes).map(cb => parseInt(cb.getAttribute('data-id')));
                allMasterData = allMasterData.filter(item => !idsToDelete.includes(item.uniqueId));
                filterTable();
                alert("Selected rows removed successfully!");
            }
        }

        // Export to CSV
        function exportToCSV() {
            if(allMasterData.length === 0) {
                alert("No data available to export!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "SL,Order Date,Delivery System,Student Name,Phone Number,Course,Level,District,Upazilla,Address Line,Status\r\n";

            allMasterData.forEach((item, index) => {
                let row = [
                    index + 1,
                    item.orderDate || '',
                    `"${item.deliverySystem || ''}"`,
                    `"${item.studentName || ''}"`,
                    `"${item.phoneNumber || ''}"`,
                    `"${item.course || ''}"`,
                    `"${item.level || ''}"`,
                    `"${item.district || ''}"`,
                    `"${item.upazilla || ''}"`,
                    `"${item.addressLine || ''}"`,
                    item.deliveryStatus || 'Pending'
                ];
                csvContent += row.join(",") + "\r\n";
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "pulse_students_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Export to Excel Workbook (.xlsx) using SheetJS
        function exportToWorkbook() {
            if(allMasterData.length === 0) {
                alert("No data available to export!");
                return;
            }

            let exportData = allMasterData.map((item, index) => ({
                "SL": index + 1,
                "Order Date": item.orderDate || '',
                "Delivery System": item.deliverySystem || '',
                "Student Name": item.studentName || '',
                "Phone Number": item.phoneNumber || '',
                "Course": item.course || '',
                "Level": item.level || '',
                "District": item.district || '',
                "Upazilla": item.upazilla || '',
                "Address Line": item.addressLine || '',
                "Status": item.deliveryStatus || 'Pending'
            }));

            let worksheet = XLSX.utils.json_to_sheet(exportData);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Students Data");
            XLSX.writeFile(workbook, "pulse_students_workbook.xlsx");
        }
    </script>
</body>
</html>
