<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Pulse Nursing</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>

        /* =========================================================
           ROOT VARIABLES
        ========================================================= */

        :root {
            --primary-pink: #ad1457;
            --dark-pink: #880e4f;
            --light-pink-bg: #fce4ec;
            --lighter-pink: #fff5f8;
            --white: #ffffff;
            --text-main: #2d3748;
            --border-color: #f8bbd0;
            --gray: #777777;
            --green: #2e7d32;
            --blue: #0277bd;
            --orange: #ef6c00;
            --teal: #00897b;
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            background: linear-gradient(
                135deg,
                #fce4ec 0%,
                #ffebee 100%
            );

            color: var(--text-main);

            padding: 20px;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =========================================================
           ADMIN CONTAINER
        ========================================================= */

        .admin-container {
            width: 100%;

            max-width: 1250px;

            background: var(--white);

            padding: 25px;

            border-radius: 16px;

            box-shadow:
                0 10px 25px rgba(173, 20, 87, 0.15);

            border-top: 6px solid var(--primary-pink);
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .admin-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

            border-bottom: 2px solid var(--border-color);

            padding-bottom: 15px;
        }


        .admin-header h2 {
            color: var(--primary-pink);

            font-size: 20px;

            font-weight: 700;
        }


        /* =========================================================
           BACK BUTTON
        ========================================================= */

        .back-btn {
            background-color: var(--gray);

            color: white;

            border: none;

            padding: 8px 14px;

            border-radius: 8px;

            font-size: 13px;

            cursor: pointer;

            text-decoration: none;

            display: flex;

            align-items: center;

            gap: 6px;

            transition: 0.2s;
        }


        .back-btn:hover {
            background-color: #555;
        }


        /* =========================================================
           FILTER BAR
        ========================================================= */

        .filter-bar {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 15px;

            background: var(--lighter-pink);

            padding: 12px;

            border-radius: 10px;

            border: 1px solid var(--border-color);

            align-items: center;
        }


        .filter-bar select,
        .filter-bar input {
            padding: 8px 12px;

            border: 1px solid var(--border-color);

            border-radius: 6px;

            font-size: 13px;

            outline: none;

            background: white;
        }


        .filter-bar input {
            flex: 1;

            min-width: 180px;
        }


        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--primary-pink);

            box-shadow:
                0 0 0 2px rgba(173, 20, 87, 0.08);
        }


        /* =========================================================
           TABLE
        ========================================================= */

        .table-responsive {
            overflow-x: auto;

            max-height: 55vh;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;
        }


        table {
            width: 100%;

            border-collapse: collapse;

            font-size: 13px;
        }


        table th,
        table td {
            border: 1px solid #ddd;

            padding: 10px;

            text-align: left;

            white-space: nowrap;
        }


        table th {
            background-color: var(--primary-pink);

            color: white;

            position: sticky;

            top: 0;

            z-index: 10;
        }


        table tbody tr:hover {
            background: #fff5f8;
        }


        /* =========================================================
           STATUS BADGES
        ========================================================= */

        .status-badge {
            padding: 4px 8px;

            border-radius: 4px;

            font-size: 11px;

            font-weight: 600;

            display: inline-block;
        }


        .status-done {
            background-color: #e8f5e9;

            color: #2e7d32;
        }


        .status-pending {
            background-color: #ffebee;

            color: #ad1457;
        }


        /* =========================================================
           ACTION AREA
        ========================================================= */

        .admin-actions {
            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;
        }


        .action-group {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        .btn-custom {
            border: none;

            padding: 9px 15px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 500;

            font-size: 13px;

            display: flex;

            align-items: center;

            gap: 6px;

            color: white;

            transition: 0.2s;
        }


        .btn-custom:hover {
            opacity: 0.9;

            transform: translateY(-1px);
        }


        .btn-excel {
            background-color: var(--green);
        }


        .btn-csv {
            background-color: var(--blue);
        }


        .btn-delete {
            background-color: var(--primary-pink);
        }


        .btn-mark-done {
            background-color: var(--teal);
        }


        .btn-mark-pending {
            background-color: var(--orange);
        }


        .btn-print {
            background-color: var(--primary-pink);
        }


        .loading-text {
            text-align: center;

            padding: 30px;

            color: var(--gray);

            font-size: 15px;
        }


        /* =========================================================
           AUTHENTICATION MODAL
        ========================================================= */

        #authModal {
            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(0, 0, 0, 0.6);

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 9999;

            padding: 20px;
        }


        .modal-card {
            background: white;

            padding: 30px;

            border-radius: 16px;

            width: 100%;

            max-width: 380px;

            text-align: center;

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.3);
        }


        .modal-card i {
            font-size: 40px;

            color: var(--primary-pink);

            margin-bottom: 15px;
        }


        .modal-card h3 {
            color: var(--primary-pink);

            margin-bottom: 8px;

            font-size: 20px;
        }


        .modal-card p {
            font-size: 13px;

            color: var(--gray);

            margin-bottom: 20px;
        }


        .modal-card input {
            width: 100%;

            padding: 12px;

            border: 1px solid var(--border-color);

            border-radius: 8px;

            font-size: 15px;

            margin-bottom: 15px;

            outline: none;

            text-align: center;
        }


        .modal-card input:focus {
            border-color: var(--primary-pink);

            box-shadow:
                0 0 0 2px rgba(173, 20, 87, 0.08);
        }


        .modal-card button {
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-pink),
                    var(--dark-pink)
                );

            color: white;

            border: none;

            padding: 12px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }


        /* =========================================================
           PRINT AREA
        ========================================================= */

        #printAreaContainer {
            display: none;
        }


        /* =========================================================
           SHIPPING CARD
        ========================================================= */

        .shipping-card {
            border: 2px solid #555;

            padding: 14px 16px;

            border-radius: 8px;

            background: #fff;

            box-sizing: border-box;

            width: 100%;

            margin-bottom: 14px;
        }


        /* =========================================================
           PRINT CARD HEADER
        ========================================================= */

        .card-top-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom: 2px solid var(--primary-pink);

            padding-bottom: 10px;

            margin-bottom: 12px;

            gap: 10px;
        }


        .logo-title-group {
            display: flex;

            align-items: center;

            gap: 14px;

            min-width: 0;
        }


        /*
         * IMPORTANT:
         * Print logo class.
         *
         * The supplied i.ibb.co.com logo URL is inserted
         * dynamically by JavaScript.
         */

        .print-logo,
        .card-top-header img {
            width: 54px !important;

            height: 54px !important;

            object-fit: contain !important;

            display: block !important;

            flex-shrink: 0;

            border-radius: 6px;

            background: #fff;

            padding: 2px;

            border: 1.5px solid var(--border-color);
        }


        .card-coaching-info {
            min-width: 0;
        }


        .card-coaching-info h4 {
            margin: 0;

            color: var(--primary-pink);

            font-size: 21px;

            font-weight: 700;
        }


        .card-coaching-info p {
            margin: 2px 0 0;

            font-size: 15px;

            color: #222;

            font-weight: 600;
        }


        /* =========================================================
           HEADER RIGHT
        ========================================================= */

        .header-right-side {
            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 6px;

            flex-shrink: 0;
        }


        .delivery-badge {
            font-size: 17px;

            font-weight: 700;

            color: var(--primary-pink);

            background: #fff;

            padding: 3px 16px;

            border-radius: 4px;

            border: 1.5px solid var(--primary-pink);

            text-align: center;

            min-width: 52px;
        }


        .second-row-info {
            display: flex;

            align-items: center;

            gap: 8px;
        }


        .course-level-badge,
        .invoice-badge {
            font-size: 14px;

            font-weight: 700;

            color: #222;

            background: #fdfdfd;

            padding: 3px 11px;

            border-radius: 4px;

            border: 1.5px solid var(--border-color);

            letter-spacing: 0.3px;
        }


        /* =========================================================
           ADDRESS SECTION
        ========================================================= */

        .card-addresses {
            display: flex;

            gap: 14px;
        }


        .address-from {
            flex: 0.9;

            border: 1.5px solid var(--border-color);

            padding: 10px 12px;

            border-radius: 6px;

            line-height: 1.25;

            font-size: 15px;

            color: #333;
        }


        .address-from b,
        .address-to b {
            color: #222;

            font-size: 15.5px;
        }


        .address-to {
            flex: 1.5;

            border: 1.5px solid var(--border-color);

            padding: 10px 12px;

            border-radius: 6px;

            font-size: 15.5px;

            line-height: 1.3;

            color: #333;
        }


        .to-grid {
            display: grid;

            grid-template-columns: 55px 1fr;

            row-gap: 2px;

            align-items: baseline;
        }


        .to-label {
            font-weight: 700;

            color: #222;
        }


        .to-content {
            min-width: 0;
        }


        .pink-highlight {
            color: var(--primary-pink);

            font-weight: 700;
        }


        .office-head-highlight {
            color: var(--primary-pink);

            font-weight: 700;

            font-size: 15.5px;
        }


        /* =========================================================
           PRINT SETTINGS
        ========================================================= */

        @media print {

            @page {
                size: A4 portrait;

                margin: 4mm;
            }


            html,
            body {
                width: 100% !important;

                min-height: 0 !important;
            }


            body {
                background: none !important;

                padding: 0 !important;

                margin: 0 !important;

                display: block !important;
            }


            .admin-container,
            #authModal {
                display: none !important;
            }


            #printAreaContainer {
                display: block !important;

                width: 100% !important;

                margin: 0 !important;

                padding: 0 !important;
            }


            .shipping-card {
                border: 2px solid #555 !important;

                background: #fff !important;

                width: 100% !important;

                box-sizing: border-box !important;

                page-break-inside: avoid !important;

                break-inside: avoid !important;

                margin-top: 0 !important;

                margin-bottom: 14px !important;

                color: #000 !important;
            }


            .print-logo,
            .card-top-header img {
                display: block !important;

                width: 54px !important;

                height: 54px !important;

                object-fit: contain !important;

                visibility: visible !important;

                opacity: 1 !important;
            }


            #printAreaContainer .shipping-card:first-child {
                margin-top: 0 !important;
            }


            .card-top-header {
                border-bottom: 2px solid #ad1457 !important;
            }


            .card-coaching-info h4,
            .pink-highlight,
            .office-head-highlight,
            .delivery-badge {
                color: #ad1457 !important;
            }
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media screen and (max-width: 768px) {

            body {
                padding: 10px;
            }


            .admin-container {
                padding: 15px;

                border-radius: 12px;
            }


            .admin-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 10px;
            }


            .filter-bar {
                flex-direction: column;

                align-items: stretch;
            }


            .filter-bar input {
                width: 100%;

                min-width: 0;
            }


            .admin-actions {
                flex-direction: column;

                align-items: stretch;
            }


            .action-group {
                width: 100%;
            }


            .btn-custom {
                justify-content: center;

                flex: 1;
            }
        }


        @media screen and (max-width: 600px) {

            .card-top-header {
                flex-direction: column;

                align-items: flex-start;
            }


            .header-right-side {
                align-items: flex-start;

                width: 100%;
            }


            .second-row-info {
                flex-wrap: wrap;
            }


            .card-addresses {
                flex-direction: column;
            }


            .address-from,
            .address-to {
                width: 100%;

                flex: none;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         AUTHENTICATION MODAL
    ========================================================= -->

    <div id="authModal">

        <div class="modal-card">

            <i class="fa-solid fa-lock"></i>

            <h3>
                Admin Authentication
            </h3>

            <p>
                Please enter your secure password to access the dashboard.
            </p>

            <input
                type="password"
                id="adminPasswordInput"
                placeholder="Enter password..."
                autofocus
                onkeydown="if(event.key === 'Enter') verifyPassword()"
            >

            <button onclick="verifyPassword()">
                Login to Dashboard
            </button>

        </div>

    </div>



    <!-- =========================================================
         MAIN ADMIN CONTAINER
    ========================================================= -->

    <div class="admin-container">


        <!-- Header -->

        <div class="admin-header">

            <h2>
                <i class="fa-solid fa-gauge"></i>
                Admin Dashboard
            </h2>


            <a
                href="index.html"
                class="back-btn"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Back to Form
            </a>

        </div>



        <!-- =====================================================
             FILTER BAR
        ===================================================== -->

        <div class="filter-bar">


            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, phone, district..."
                onkeyup="filterTable()"
            >


            <select
                id="filterCourse"
                onchange="filterTable()"
            >

                <option value="">
                    All Courses
                </option>

                <option value="BSC">
                    BSC
                </option>

                <option value="DIPLOMA">
                    DIPLOMA
                </option>

                <option value="Midwifery">
                    Midwifery
                </option>

            </select>



            <select
                id="filterLevel"
                onchange="filterTable()"
            >

                <option value="">
                    All Levels
                </option>

                <option value="Admission">
                    Admission
                </option>

                <option value="License">
                    License
                </option>

                <option value="Job">
                    Job
                </option>

                <option value="Academic">
                    Academic
                </option>

            </select>



            <select
                id="filterStatus"
                onchange="filterTable()"
            >

                <option value="">
                    All Status
                </option>

                <option value="Delivered">
                    Delivered
                </option>

                <option value="Pending">
                    Pending
                </option>

            </select>

        </div>



        <!-- =====================================================
             DATA TABLE
        ===================================================== -->

        <div class="table-responsive">

            <table id="dataTable">

                <thead>

                    <tr>

                        <th>
                            <input
                                type="checkbox"
                                id="selectAll"
                                onclick="toggleSelectAll(this)"
                            >
                        </th>

                        <th>
                            SL
                        </th>

                        <th>
                            Order Date
                        </th>

                        <th>
                            Delivery System
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Phone Number
                        </th>

                        <th>
                            Course
                        </th>

                        <th>
                            Level
                        </th>

                        <th>
                            District
                        </th>

                        <th>
                            Upazilla
                        </th>

                        <th>
                            Address Line
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="tableBody">

                    <tr>

                        <td
                            colspan="12"
                            class="loading-text"
                        >
                            Please login first...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>



        <!-- =====================================================
             ACTION BUTTONS
        ===================================================== -->

        <div class="admin-actions">


            <div class="action-group">

                <button
                    class="btn-custom btn-mark-done"
                    onclick="markSelectedStatus('Delivered')"
                >

                    <i class="fa-solid fa-check"></i>

                    Mark Delivered

                </button>


                <button
                    class="btn-custom btn-mark-pending"
                    onclick="markSelectedStatus('Pending')"
                >

                    <i class="fa-solid fa-clock"></i>

                    Mark Pending

                </button>


                <button
                    class="btn-custom btn-print"
                    onclick="printSelectedRows()"
                >

                    <i class="fa-solid fa-print"></i>

                    Print Selected

                </button>


                <button
                    class="btn-custom btn-delete"
                    onclick="deleteSelectedRows()"
                >

                    <i class="fa-solid fa-trash"></i>

                    Delete Selected

                </button>

            </div>



            <div class="action-group">

                <button
                    class="btn-custom btn-csv"
                    onclick="exportToCSV()"
                >

                    <i class="fa-solid fa-file-csv"></i>

                    Export CSV

                </button>


                <button
                    class="btn-custom btn-excel"
                    onclick="exportToWorkbook()"
                >

                    <i class="fa-solid fa-file-excel"></i>

                    Export Workbook (.xlsx)

                </button>

            </div>

        </div>

    </div>



    <!-- =========================================================
         PRINT AREA
    ========================================================= -->

    <div id="printAreaContainer"></div>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>


        /* =========================================================
           GOOGLE APPS SCRIPT URL
        ========================================================= */

        const scriptURL =
            'https://script.google.com/macros/s/AKfycbyx9vPi6Ob_-FR4j3TQlDDWpwBkgi4ILek5VBz9HcHk-rOBqF29-viIyIID4jXZxgCF/exec';


        /* =========================================================
           LOGO URL
           
           IMPORTANT:
           This exact logo URL will be used in the print layout.
        ========================================================= */

        const PRINT_LOGO_URL =
            'https://i.ibb.co.com/Ld7snkkP/logo.png';


        /* =========================================================
           GLOBAL DATA
        ========================================================= */

        let allMasterData = [];



        /* =========================================================
           AUTHENTICATION
        ========================================================= */

        function verifyPassword() {

            const password =
                document.getElementById(
                    'adminPasswordInput'
                ).value;


            if (password === "SM@890174s") {

                document.getElementById(
                    'authModal'
                ).style.display = 'none';


                loadTableData();

            }

            else {

                alert(
                    "Incorrect Password!"
                );


                document.getElementById(
                    'adminPasswordInput'
                ).value = '';

            }

        }



        /* =========================================================
           LOAD DATA
        ========================================================= */

        function loadTableData() {

            const tableBody =
                document.getElementById(
                    'tableBody'
                );


            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="12"
                        class="loading-text"
                    >
                        Loading data from Google Sheets...
                    </td>
                </tr>
            `;


            fetch(scriptURL)

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            'Network response was not OK'
                        );

                    }

                    return response.json();

                })


                .then(data => {

                    let savedStatuses =
                        JSON.parse(
                            localStorage.getItem(
                                'pulse_delivery_status'
                            ) || '{}'
                        );


                    allMasterData =
                        data.map(
                            (item, index) => {

                                return {

                                    ...item,

                                    uniqueId: index,

                                    deliveryStatus:
                                        savedStatuses[index]
                                        ||
                                        'Pending'

                                };

                            }
                        );


                    renderTable(
                        allMasterData
                    );

                })


                .catch(error => {

                    tableBody.innerHTML = `

                        <tr>

                            <td
                                colspan="12"
                                style="
                                    text-align:center;
                                    color:red;
                                    padding:20px;
                                "
                            >

                                Failed to load data.

                            </td>

                        </tr>

                    `;


                    console.error(
                        'Error loading data:',
                        error
                    );

                });

        }



        /* =========================================================
           RENDER TABLE
        ========================================================= */

        function renderTable(
            dataToRender
        ) {

            const tableBody =
                document.getElementById(
                    'tableBody'
                );


            tableBody.innerHTML = '';


            if (
                dataToRender.length === 0
            ) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="12"
                            style="
                                text-align:center;
                                color:#777;
                                padding:20px;
                            "
                        >

                            No data found.

                        </td>

                    </tr>

                `;

                return;

            }



            dataToRender.forEach(
                (item, index) => {


                    let statusBadge =
                        item.deliveryStatus ===
                        'Delivered'

                        ?

                        `
                        <span
                            class="status-badge status-done"
                        >
                            Delivered
                        </span>
                        `

                        :

                        `
                        <span
                            class="status-badge status-pending"
                        >
                            Pending
                        </span>
                        `;



                    let row =
                        document.createElement(
                            'tr'
                        );


                    row.innerHTML = `

                        <td>

                            <input
                                type="checkbox"
                                class="row-checkbox"
                                data-id="${item.uniqueId}"
                            >

                        </td>


                        <td>
                            ${index + 1}
                        </td>


                        <td>
                            ${item.orderDate || ''}
                        </td>


                        <td>
                            ${item.deliverySystem || ''}
                        </td>


                        <td>
                            ${item.studentName || ''}
                        </td>


                        <td>
                            ${item.phoneNumber || ''}
                        </td>


                        <td>
                            ${item.course || ''}
                        </td>


                        <td>
                            ${item.level || ''}
                        </td>


                        <td>
                            ${item.district || ''}
                        </td>


                        <td>
                            ${item.upazilla || ''}
                        </td>


                        <td>
                            ${item.addressLine || ''}
                        </td>

                        </td>

                    `;


                    tableBody.appendChild(

                    );

                }

        }



        /* =========================================================
           FILTER TABLE
        ========================================================= */

        function filterTable() {

            let searchVal =
                document.getElementById(
                    'searchInput'
                ).value.toLowerCase();


            let courseVal =
                document.getElementById(
                    'filterCourse'
                ).value;


            let levelVal =
                document.getElementById(
                    'filterLevel'
                ).value;


            let statusVal =
                document.getElementById(
                    'filterStatus'
                ).value;



            let filtered =
                allMasterData.filter(
                    item => {


                        let matchesSearch =

                            (
                                item.studentName &&
                                item.studentName
                                    .toLowerCase()
                                    .includes(searchVal)
                            )

                            ||

                            (
                                item.phoneNumber &&
                                item.phoneNumber
                                    .includes(searchVal)
                            )

                            ||

                            (
                                item.district &&
                                item.district
                                    .toLowerCase()
                                    .includes(searchVal)
                            );



                        let matchesCourse =
                            courseVal === "" ||
                            item.course === courseVal;


                        let matchesLevel =
                            levelVal === "" ||
                            item.level === levelVal;


                        let matchesStatus =
                            statusVal === "" ||
                            item.deliveryStatus ===
                            statusVal;



                        return (
                            matchesSearch &&
                            matchesCourse &&
                            matchesLevel &&
                            matchesStatus
                        );

                    }
                );


            renderTable(
                filtered
            );

        }



        /* =========================================================
           SELECT ALL
        ========================================================= */

        function toggleSelectAll(
            masterCheckbox
        ) {

            let checkboxes =
                document.querySelectorAll(
                    '.row-checkbox'
                );


            checkboxes.forEach(
                cb => {

                    cb.checked =
                        masterCheckbox.checked;

                }
            );

        }



        /* =========================================================
           MARK STATUS
        ========================================================= */

        function markSelectedStatus(
            status
        ) {

            let selectedCheckboxes =
                document.querySelectorAll(
                    '.row-checkbox:checked'
                );


            if (
                selectedCheckboxes.length === 0
            ) {

                alert(
                    "Please select at least one student!"
                );

                return;

            }



            let savedStatuses =
                JSON.parse(
                    localStorage.getItem(
                        'pulse_delivery_status'
                    ) || '{}'
                );


            selectedCheckboxes.forEach(
                cb => {

                    let id =
                        cb.getAttribute(
                            'data-id'
                        );


                    savedStatuses[id] =
                        status;


                    let found =
                        allMasterData.find(
                            item =>
                                item.uniqueId == id
                        );


                    if (found) {

                        found.deliveryStatus =
                            status;

                    }

                }
            );


            localStorage.setItem(
                'pulse_delivery_status',
                JSON.stringify(
                    savedStatuses
                )
            );


            filterTable();


            alert(
                `Successfully marked as ${status}!`
            );

        }



        /* =========================================================
           PRINT SELECTED ROWS
        ========================================================= */

        function printSelectedRows() {


            /*
             * Find selected rows.
             */

            let selectedCheckboxes =
                document.querySelectorAll(
                    '.row-checkbox:checked'
                );


            if (
                selectedCheckboxes.length === 0
            ) {

                alert(
                    "Please select at least one row to print!"
                );

                return;

            }



            /*
             * Get print container.
             */

            let printContainer =
                document.getElementById(
                    'printAreaContainer'
                );


            /*
             * Clear previous print data.
             */

            printContainer.innerHTML = '';



            /*
             * Create every selected shipping card.
             */

            selectedCheckboxes.forEach(
                cb => {


                    let id =
                        cb.getAttribute(
                            'data-id'
                        );


                    let item =
                        allMasterData.find(
                            d =>
                                d.uniqueId == id
                        );


                    if (!item) {
                        return;
                    }



                    /*
                     * Delivery type.
                     */

                    let badgeText =
                        (
                            item.deliverySystem &&
                            item.deliverySystem
                                .toLowerCase()
                                .includes('home')
                        )

                        ?

                        'HD'

                        :

                        'OD';



                    /*
                     * IMPORTANT LOGO.
                     *
                     * The requested logo URL is used here.
                     */

                    let logoUrl =
                        PRINT_LOGO_URL;



                    /*
                     * Phone.
                     */

                    let phone =
                        item.phoneNumber || '';



                    /*
                     * Invoice date.
                     */

                    let dateObj =
                        new Date(
                            item.orderDate ||
                            Date.now()
                        );


                    let yy =
                        String(
                            dateObj.getFullYear()
                        ).slice(-2);


                    let mm =
                        String(
                            dateObj.getMonth() + 1
                        ).padStart(
                            2,
                            '0'
                        );


                    let dd =
                        String(
                            dateObj.getDate()
                        ).padStart(
                            2,
                            '0'
                        );


                    let datePart =
                        yy + mm + dd;


                    let phoneLast3 =
                        phone.slice(-3);


                    let invoiceNo =
                        `${datePart}-${phoneLast3}-${item.uniqueId + 1}`;



                    /* =================================================
                       TO ADDRESS
                    ================================================= */

                    let toAddressHTML = `

                        <div class="to-grid">

                            <span class="to-label">
                                Name:
                            </span>

                            <span class="to-content">
                                <b>
                                    ${item.studentName || ''}
                                </b>
                            </span>


                            <span class="to-label">
                                Ph:
                            </span>

                            <span class="to-content">
                                <b>
                                    ${phone}
                                </b>
                            </span>


                            <span class="to-label">
                                Dist:
                            </span>

                            <span class="to-content">

                                <span class="pink-highlight">
                                    ${item.district || ''}
                                </span>

                                ${
                                    item.upazilla

                                    ?

                                    `
                                    | Up/Thana:
                                    <span class="pink-highlight">
                                        ${item.upazilla}
                                    </span>
                                    `

                                    :

                                    ''
                                }

                            </span>

                    `;



                    /*
                     * Home Delivery address.
                     */

                    if (
                        badgeText === 'HD' &&
                        item.addressLine
                    ) {

                        toAddressHTML += `

                            <span class="to-label">
                                Addr:
                            </span>

                            <span class="to-content">
                                ${item.addressLine}
                            </span>

                        `;

                    }



                    toAddressHTML += `
                        </div>
                    `;



                    /* =================================================
                       SHIPPING CARD
                    ================================================= */

                    let cardHTML = `

                        <div class="shipping-card">


                            <!-- ================================
                                 CARD HEADER
                            ================================= -->

                            <div class="card-top-header">


                                <div class="logo-title-group">


                                    <!--
                                         IMPORTANT:
                                         Logo URL requested by user.
                                         No onerror hiding is used.
                                    -->

                                    <img
                                        src="${logoUrl}"
                                        alt="Pulse Nursing Coaching Logo"
                                        class="print-logo"
                                    >


                                    <div class="card-coaching-info">

                                        <h4>
                                            Pulse Nursing Coaching
                                        </h4>

                                        <p>
                                            Farmgate, Dhaka
                                            |
                                            Phone: 01792-439561
                                        </p>

                                    </div>

                                </div>



                                <!-- =========================
                                     RIGHT SIDE
                                ========================== -->

                                <div class="header-right-side">


                                    <div class="delivery-badge">
                                        ${badgeText}
                                    </div>


                                    <div class="second-row-info">


                                        <div class="course-level-badge">

                                            ${
                                                item.level || ''
                                            }

                                            |

                                            ${
                                                item.course || ''
                                            }

                                        </div>


                                        <div class="invoice-badge">

                                            Inv:
                                            ${invoiceNo}

                                        </div>


                                    </div>

                                </div>


                            </div>



                            <!-- ================================
                                 ADDRESS SECTION
                            ================================= -->

                            <div class="card-addresses">


                                <!-- FROM -->

                                <div class="address-from">

                                    <b>
                                        From:
                                    </b>

                                    <br>


                                    <span
                                        class="office-head-highlight"
                                    >
                                        Pulse Nursing Head Office
                                    </span>

                                    <br>

                                    Farmgate, Dhaka

                                    <br>

                                    Ph:
                                    01792-439561

                                </div>



                                <!-- TO -->

                                <div class="address-to">

                                    <b>
                                        To:
                                    </b>

                                    <br>

                                    ${toAddressHTML}

                                </div>


                            </div>


                        </div>

                    `;



                    /*
                     * Add card to print container.
                     */

                    printContainer.insertAdjacentHTML(
                        'beforeend',
                        cardHTML
                    );

                }
            );



            /*
             * Give the browser a small amount of time
             * to load the remote logo before printing.
             */

            waitForPrintImages(
                printContainer
            );

        }



        /* =========================================================
           WAIT FOR PRINT IMAGES
           
           This is the main improvement for the logo.
           
           The browser waits until the logo is loaded
           before opening the print dialog.
        ========================================================= */

        function waitForPrintImages(
            container
        ) {


            const images =
                Array.from(
                    container.querySelectorAll(
                        'img'
                    )
                );


            /*
             * If there are no images,
             * print immediately.
             */

            if (
                images.length === 0
            ) {

                window.print();

                clearPrintAreaAfterPrint();

                return;

            }



            /*
             * Create promises for all images.
             */

            const imagePromises =
                images.map(
                    img => {


                        /*
                         * Already loaded.
                         */

                        if (
                            img.complete &&
                            img.naturalWidth > 0
                        ) {

                            return Promise.resolve();

                        }



                        /*
                         * Wait for load.
                         */

                        return new Promise(
                            resolve => {


                                let finished =
                                    false;


                                const finish =
                                    () => {

                                        if (
                                            finished
                                        ) {
                                            return;
                                        }


                                        finished =
                                            true;


                                        resolve();

                                    };



                                img.addEventListener(
                                    'load',
                                    finish,
                                    {
                                        once: true
                                    }
                                );


                                img.addEventListener(
                                    'error',
                                    finish,
                                    {
                                        once: true
                                    }
                                );


                                /*
                                 * Safety timeout.
                                 */

                                setTimeout(
                                    finish,
                                    3000
                                );

                            }
                        );

                    }
                );



            /*
             * Wait for every image.
             */

            Promise.all(
                imagePromises
            ).then(
                () => {


                    /*
                     * Extra delay allows the browser
                     * to finish rendering the image.
                     */

                    setTimeout(
                        () => {

                            window.print();

                            clearPrintAreaAfterPrint();

                        },
                        250
                    );

                }
            );

        }



        /* =========================================================
           CLEAR PRINT AREA
        ========================================================= */

        function clearPrintAreaAfterPrint() {

            setTimeout(
                () => {

                    document.getElementById(
                        'printAreaContainer'
                    ).innerHTML = '';

                },
                1000
            );

        }



        /* =========================================================
           DELETE SELECTED ROWS
        ========================================================= */

        function deleteSelectedRows() {

            let selectedCheckboxes =
                document.querySelectorAll(
                    '.row-checkbox:checked'
                );


            if (
                selectedCheckboxes.length === 0
            ) {

                alert(
                    "Please select at least one row to delete!"
                );

                return;

            }



            if (
                confirm(
                    "Are you sure you want to delete selected rows from the view?"
                )
            ) {


                let idsToDelete =
                    Array.from(
                        selectedCheckboxes
                    ).map(
                        cb =>
                            parseInt(
                                cb.getAttribute(
                                    'data-id'
                                )
                            )
                    );



                allMasterData =
                    allMasterData.filter(
                        item =>
                            !idsToDelete.includes(
                                item.uniqueId
                            )
                    );


                filterTable();


                alert(
                    "Selected rows removed successfully!"
                );

            }

        }



        /* =========================================================
           EXPORT CSV
        ========================================================= */

        function exportToCSV() {


            if (
                allMasterData.length === 0
            ) {

                alert(
                    "No data available to export!"
                );

                return;

            }



            let csvContent =
                "data:text/csv;charset=utf-8,";



            csvContent +=
                "SL,Order Date,Delivery System,StudentName,PhoneNumber,Course,Level,District,Upazilla,AddressLine,Status\r\n";



            allMasterData.forEach(
                (item, index) => {


                    let row = [

                        index + 1,

                        item.orderDate || '',

                        `"${item.deliverySystem || ''}"`,

                        `"${item.studentName || ''}"`,

                        `"${item.phoneNumber || ''}"`,

                        `"${item.course || ''}"`,

                        `"${item.level || ''}"`,

                        `"${item.district || ''}"`,

                        `"${item.upazilla || ''}"`,

                        `"${item.addressLine || ''}"`,

                        item.deliveryStatus ||
                        'Pending'

                    ];



                    csvContent +=
                        row.join(",") +
                        "\r\n";

                }
            );



            let encodedUri =
                encodeURI(
                    csvContent
                );


            let link =
                document.createElement(
                    "a"
                );


            link.setAttribute(
                "href",
                encodedUri
            );


            link.setAttribute(
                "download",
                "pulse_students_data.csv"
            );


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );

        }



        /* =========================================================
           EXPORT EXCEL WORKBOOK
        ========================================================= */

        function exportToWorkbook() {


            if (
                allMasterData.length === 0
            ) {

                alert(
                    "No data available to export!"
                );

                return;

            }



            let exportData =
                allMasterData.map(
                    (item, index) => ({

                        "SL":
                            index + 1,

                        "Order Date":
                            item.orderDate || '',

                        "Delivery System":
                            item.deliverySystem || '',

                        "Student Name":
                            item.studentName || '',

                        "Phone Number":
                            item.phoneNumber || '',

                        "Course":
                            item.course || '',

                        "Level":
                            item.level || '',

                        "District":
                            item.district || '',

                        "Upazilla":
                            item.upazilla || '',

                        "Address Line":
                            item.addressLine || '',

                        "Status":
                            item.deliveryStatus ||
                            'Pending'

                    })
                );



            let worksheet =
                XLSX.utils.json_to_sheet(
                    exportData
                );


            let workbook =
                XLSX.utils.book_new();


            XLSX.utils.book_append_sheet(
                workbook,
                worksheet,
                "Students Data"
            );


            XLSX.writeFile(
                workbook,
                "pulse_students_workbook.xlsx"
            );

        }


    </script>
